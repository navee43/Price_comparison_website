<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Contact Us</title>
       <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@300;600&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      /* font-family: 'Nunito', sans-serif; */
      background-color: #fefde9;
      color: #1a1a1a;
    }

    .container {
      display: flex;
      flex-direction: row;
      justify-content: space-between;
      align-items: center;
      padding: 4rem 6%;
      min-height: 90vh;
    }

    .left {
      flex: 1;
      padding-right: 2rem;
    }

    .left h1 {
      font-size: 3rem;
      font-weight: 600;
      margin-bottom: 1rem;
    }

    .left p {
      max-width: 500px;
      color: #555;
      font-size: 1rem;
      line-height: 1.6;
    }

    .right {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    input, textarea {
      padding: 1rem;
      border: none;
      border-radius: 6px;
      background-color: #f5f3c8;
      font-size: 1rem;
      color: #444;
    }

    textarea {
      resize: vertical;
      min-height: 120px;
    }

    .btn {
      background-color: #b6ad56;
      color: white;
      padding: 1rem;
      border: none;
      border-radius: 6px;
      font-size: 1rem;
      cursor: pointer;
      transition: background-color 0.3s ease;
    }

    .btn:hover {
      background-color: #a29b4a;
    }

    .socials {
      margin-top: 3rem;
      text-align: center;
    }

    .socials i {
      font-size: 1.8rem;
      color: #b6ad56;
      margin: 0 1rem;
      cursor: pointer;
      transition: transform 0.2s ease;
    }

    .socials i:hover {
      transform: scale(1.2);
    }

    @media (max-width: 768px) {
      .container {
        flex-direction: column;
      }

      .left, .right {
        padding-right: 0;
        width: 100%;
      }
    }
     #head{
          box-shadow: 0px 2px 5px ;
    max-width: 100vw;
    display: flex;
    align-items:center;
    justify-content:space-between;
    padding: 10px;
    padding-bottom: 15px;
    background: white;
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    z-index: 999; 
    .header_text{
        font-size: 25px;
        background: rgb(255,190,200) ;
        padding-left: 8px;
        padding-right: 8px;
        border-radius: 5px;
      
        -webkit-border-radius: 5px;
        -moz-border-radius: 5px;
        -ms-border-radius: 5px;
        -o-border-radius: 5px;
    }
    
    /* img{
        height: 50px;
        width: 50px;
        border-radius: 50%;
        margin-left: 70px;
        -webkit-border-radius: 50%;
        -moz-border-radius: 50%;
        -ms-border-radius: 50%;
        -o-border-radius: 50%;
    } */

        #phone_bar{
            display:none;
            color: black;
            font-size: 25px;
            padding-right: 25px;
        
        }
        .navbar {
            
        transition: all 0.3s ease;
    }
    .nav-li {
        display: flex;
        list-style: none;
    

        
    }

    .navbar .nav-li a{
        text-transform: uppercase;
    
        text-decoration: none;
    font-size: 1.3rem;
        color: black;
        padding: 0px 40px;  
        transition: all 0.3s ease;
        position: relative;
        
        /* text-shadow: 0 0 5px #FFF, 0 0 6px #FFF, 0 0 8px #FFF, 0 0 8px #ecf7e9, 0 0 8px #e5efe3, 0 0 8px #ebf3e9, 0 0 8px #e6e8e5, 0 0 8px #dbe6d9;
    color: #FFFFFF; */

    }

    .navbar .nav-li a:hover{
        /* text-shadow: 0 0 5px #FFF, 0 0 10px #FFF, 0 0 15px #FFF, 0 0 20px #fa0808, 0 0 30px #ff0606, 0 0 40px #fe0505, 0 0 55px #f10808, 0 0 75px #fb3f3f; */
        
        width: 100%;
        color: pink;
        
    }
    }

    .navbar .nav-li a::after {
        content: '';
        position: absolute;
        bottom: -5px;
        left: 0;
        width: 0;
        height: 2px;
        background: linear-gradient(45deg, pink, white   );
        transition: width 0.3s ease;
    }
    .nav-li a:hover::after {
        width: 100%;
    }

      @media (max-width: 390px) {
        #head {
        
        
            img{
                width: 40px;
                height: 40px;
                margin-left: 35px;
                

            }
            .navbar{
                display: none;
            }
            #phone_bar{
                display: block;
                margin-right: 10px;
                font-size: 30px;
            }

        
        }
    }

  </style>
  <script src="https://kit.fontawesome.com/a076d05399.js" crossorigin="anonymous"></script>
</head>
<body>

     <header id="head">
  <h1 class="header_text">Quick Compare</h1>

  <i class="fa-solid fa-bars" id="phone_bar"></i>

  <div class="navbar" id="navbar">
    <ul class="nav-li">
      <li><a href="./index.html">Home</a></li>
      <li><a href="#" onclick="focusSearchBar()">Compare</a></li>
      <li><a href="#">About</a></li>
      <li><a href="./contactUs.html">Contact</a></li>
    </ul>
  </div>
</header>
  <div class="container">
    <div class="left">
      <h1>Get in touch<br></h1>
     
    </div>

    <div class="right">
      <input type="text" placeholder="Name" required />
      <input type="text" placeholder="Contact Number" required />
      <input type="email" placeholder="Email" required />
      <textarea placeholder="Message"></textarea>
      <button class="btn">Send</button>
    </div>
  </div>

  <div class="socials">
    <i class="fab fa-facebook"></i>
    <i class="fab fa-instagram"></i>
    <i class="fab fa-twitter"></i>
    <i class="fab fa-linkedin"></i>
  </div>
</body>
</html>
